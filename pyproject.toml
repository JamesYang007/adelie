[project]
name = "adelie"
dynamic = ["version"]
authors = [
    { name="James Yang", email="jamesyang916@gmail.com" },
]
maintainers = [
    { name="James Yang", email="jamesyang916@gmail.com" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
description = "A fast, flexible package for group elastic net."
license = {file = "LICENSE"}
keywords = ["group lasso", "group elastic net", "lasso", "elastic net"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0, <3",
    "scipy>=1.13, <2",
    "matplotlib>=3.8, <4",
    "ipython>=9.0, <10",
    "scikit-learn>=1.5, <2",
]

[project.urls]
Homepage = "https://github.com/JamesYang007/adelie"
Documentation = "https://jamesyang007.github.io/adelie"
Repository = "https://github.com/JamesYang007/adelie"

[tool.poetry]
name = "adelie"
version = "0.0.0"
description = "A fast, flexible package for group elastic net."
authors = [
    "James Yang <jamesyang916@gmail.com>",
]

[tool.poetry.dependencies]
python = ">=3.11,<4"
numpy = "^2.0"
scipy = "^1.13"
matplotlib = "^3.8"
ipython = "^9.0"
scikit-learn = "^1.5"

[tool.poetry.group.test.dependencies]
pytest = "^8.0"
cvxpy = "^1.5"
mosek = {version = "^11.0", python = ">=3.11,<3.15"}

[tool.poetry.group.doc.dependencies]
sphinx = "^8.0"
pydata-sphinx-theme = "^0.16"
numpydoc = "^1.8"
nbsphinx = "^0.9.5"
sphinx-design = "^0.6"
pgenlib = "^0.90.2"
knockpy = "^1.3"

[tool.poetry.group.dev.dependencies]
cibuildwheel = "^2.20"
pandas = "^2.2"
pre-commit = "^3.7"
pybind11 = "^3.0"
nbformat = "^5.10"
jupyter = "^1.1"
jupytext = "^1.16"
tqdm = "^4.66"
latextable = "^1.0"
twine = "^5.0"
tabulate = "^0.9"

[tool.jupytext]
notebook_metadata_filter = "-all"
cell_metadata_filter = "-all"

[build-system]
requires = [
    "setuptools",
    "wheel",
    "pybind11>=3.0",
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build-frontend = "build"

[tool.setuptools_scm]
